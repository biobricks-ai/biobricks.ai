version: "3.9"
services:
  
  bbportal:
    build: .
    image: 951523641836.dkr.ecr.us-east-1.amazonaws.com/bbportal:latest
    entrypoint: python src/main.py bbportal
    env_file: [ "${ENV:-env_prod.env}" ]
    ports: [ "5000:5000" ]

  dvcportal:
    build: .
    image: 951523641836.dkr.ecr.us-east-1.amazonaws.com/bbportal:latest
    entrypoint: python src/main.py dvcportal
    env_file: [ "${ENV:-env_prod.env}" ]
    ports: [ "5001:5000" ]