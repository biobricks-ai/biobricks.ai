version: "3.9"
services:
  
  bbportal:
    build: .
    image: 951523641836.dkr.ecr.us-east-1.amazonaws.com/bbportal:latest
    entrypoint: >
      bash -c "PYTHONPATH=/app/src 
      gunicorn -b 0.0.0.0:5002 -w 4 -k gthread -t 300 
      'src.bbportal.app:create_app()'"
    env_file: [ "${ENV:-env_prod.env}" ]
    ports: [ "5002:5002" ]
    volumes: 
      - "data:/data"

  dvcportal:
    build: .
    image: 951523641836.dkr.ecr.us-east-1.amazonaws.com/bbportal:latest
    entrypoint: >
      bash -c "PYTHONPATH=/app/src 
      gunicorn -b 0.0.0.0:5001 -w 4 -k gthread -t 300 
      'src.dvcportal.app:create_app()'"
    env_file: [ "${ENV:-env_prod.env}" ]
    ports: [ "5001:5001" ]
    volumes: 
      - "data:/data"
  
# create a volume at /data/bbportal named 'data'
# this volume will be shared between bbportal and dvcportal
volumes:
  data:
    driver: local
    driver_opts:
      type: none
      device: /data/bbportal
      o: bind
      