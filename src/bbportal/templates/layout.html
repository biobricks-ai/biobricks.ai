  <style>

  .brick-theme .nav-link {
    background-color: #3d030c;
    color: #FFF;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 5px;
  }

  .brick-theme .nav-link:hover {
    background-color: #d8122f;
    color: #FFF;
    text-decoration: none;
  }

  .brick-theme .nav-link.active {
    background-color: #6e0616;
    color: #FFF;
  }
  
  .console-line {
    margin: 0;
  }

  .console-command{
    background-color: #41040d;
    width: 100%;
  }

  </style>
  <script>
    
    function console_append(line){
      const console = document.getElementById('console');
      const p = document.createElement('p');
      p.style.margin = '0';
      p.innerText = line;
      console.appendChild(p);
      console.scrollTop = console.scrollHeight;
    }

    function sendRequest() {
      const inputField = document.getElementById('console-input');
      const inputValue = inputField.value;
      const url = '/process_input?input=' + encodeURIComponent(inputValue);
      fetch(url)
        .then(response => response.json())
        .then(data => {
          console.log(data);
          // Handle the JSON response data here
        });
    }

    function handleKeyUp(event) {
      if (event.key === 'Enter') {
        const inputField = document.getElementById('console-input');
        const inputValue = inputField.value;
        console_append("$ " + inputValue)
        inputField.value = '';
        sendRequest();
      }
    }
  </script>
