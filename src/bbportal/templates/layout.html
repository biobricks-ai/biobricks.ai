  <script>
    
    function console_append(line){
      const console = document.getElementById('console');
      const p = document.createElement('p');
      p.style.margin = '0';
      p.innerText = line;
      console.appendChild(p);
      console.scrollTop = console.scrollHeight;
    }

    function sendRequest() {
      const inputField = document.getElementById('console-input');
      const inputValue = inputField.value;
      const url = '/process_input?input=' + encodeURIComponent(inputValue);
      fetch(url)
        .then(response => response.json())
        .then(data => {
          console.log(data);
          // Handle the JSON response data here
        });
    }

    function handleKeyUp(event) {
      if (event.key === 'Enter') {
        const inputField = document.getElementById('console-input');
        const inputValue = inputField.value;
        console_append("$ " + inputValue)
        inputField.value = '';
        sendRequest();
      }
    }
  </script>

<script src="static/console.js"></script>
<script>
  function toggleLeftNav() {
    const leftnav = document.getElementById('leftnav');
    if (leftnav.style.width === '280px') {
      
      const leftNavElements = leftnav.querySelectorAll('*');

      leftNavElements.forEach((element) => {
        element.style.display = 'none';
      });

      leftnav.style.flexBasis = '10px';
      leftnav.style.width = '10px';

    } else {
      leftnav.style.width = '280px';
      leftnav.style.flexBasis = '280px';
      const leftNavElements = leftnav.querySelectorAll('*');
      leftNavElements.forEach((element) => {
        element.style.display = 'block';
      });
    }
  }
  
  if (window.innerWidth < 600) {
    toggleLeftNav();
  }
</script>
